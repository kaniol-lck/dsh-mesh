name: plugin check

# Pre-publish gate: syntax + the client-bundle id resolution test. Both failures that
# reached npm (0.4.36 and 0.4.40) would have been caught here before publishing.
on:
  push:
    paths:
      - 'plugins/mesh-waker/**'
      - 'test/**'
      - 'scripts/**'
      - 'docs/**'
      - 'skills/**'
      - 'qa/**'
      - 'AGENTS.md'
      - '.github/workflows/plugin-check.yml'
  pull_request:
    paths:
      - 'plugins/mesh-waker/**'
      - 'test/**'
      - 'scripts/**'
      - 'docs/**'
      - 'skills/**'
      - 'qa/**'
      - 'AGENTS.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check plugins/mesh-waker/index.js
          node --check plugins/mesh-waker/client.js

      - name: Test suite
        run: node --test test/*.test.js test/*.test.mjs

      - name: Secret scan
        run: python3 scripts/check-secrets.py

      - name: Path/topology guard
        run: node scripts/check-paths.mjs

      # 标题不是身份（owner 已纠正两次）。2026-11-19 只修了 coord-scope 一个脚本，
      # 同一个正则 4 天后在 receipt-flow 原样发作（老会话被反复唤醒）——一处一修、没有门禁，
      # 同一类必然复发。这一步就是那道门禁：把标题变成判断的调用点必须显式声明
      # accounting / display / fallback，否则 CI 红。
      - name: Title is never an identity
        run: node scripts/check-no-title-identity.mjs

      # 内存里没有 ≠ 任务死了。2026-11-26 T-MWXHO5U1 被判 lost 时会话还活着 5 分半，
      # 回执却写着「resend if still needed」——把「本进程忘了」当成「任务没了」。
      - name: Memory is not the session
        run: node scripts/check-no-memory-only-death.mjs

      - name: Tool contract guard
        run: node scripts/check-tool-contract.mjs --no-failures

      # 生产文档不靠催（owner 2026-11-20）：工具参数只活在 schema 里、文档靠手抄，必然漂移。
      # 2026-11-20 实测：`mesh_dispatch.mode`（steer 的派活入口）在任何文档里都不存在。
      # 这两步一起工作：参考页由 schema 生成，门禁断言「文档 == schema」。
      - name: Tool reference is generated from schema
        run: node scripts/gen-tool-reference.mjs --check

      - name: Tool docs match schema
        run: node scripts/check-tool-docs.mjs

      # 这两个检查早就存在，但一直没进 CI —— 存在但不拦，等于没有。
      - name: Docs links
        run: node scripts/check-docs-links.mjs

      # 2026-11-20 接入：此前 4 篇签名写着 hub=^0.7.21 而实际已 0.8.1，因为这两个检查从未进 CI
      # 所以没人知道。docs 核对内容并升签名后（edefdcd）才接成 --strict——先修内容再接门禁，
      # 否则 CI 会常红，人就会开始习惯性忽略它。
      - name: Docs drift (version signatures)
        run: node scripts/check-docs-drift.mjs --strict

      # QA 行为层（L2）：真调创建入口看产出，见 qa/charter.md
      - name: QA behaviour probes
        run: node qa/run.mjs

      - name: No duplicate tool implementations
        run: node scripts/check-duplicates.mjs

      - name: UI tokens
        run: node scripts/check-ui-tokens.mjs --strict

      - name: Changelog format
        run: node scripts/check-changelog.mjs

      - name: Version sync
        run: node scripts/check-version-sync.mjs
